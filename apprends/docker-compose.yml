version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: apprends
      POSTGRES_PASSWORD: apprends_dev
      POSTGRES_DB: apprends
    volumes:
      - apprends_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apprends"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  apprends_postgres:
